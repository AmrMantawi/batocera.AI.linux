# Acoustic Echo Cancellation (AEC) for rk3588 boards with mic + speaker
#
# Loads the WebRTC-based echo canceller. Creates two virtual nodes:
#   - echo-cancel-source: AEC-processed mic (use this for recording)
#   - echo-cancel-sink:   routes to real speaker + feeds canceller
#
# WirePlumber will set echo-cancel-source as the default capture device.

context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            capture.props = {
                node.name = "echo-cancel-capture"
            }
            source.props = {
                node.name        = "echo-cancel-source"
                node.description = "Microphone (Echo Cancelled)"
                media.class      = "Audio/Source"
            }
            sink.props = {
                node.name        = "echo-cancel-sink"
                node.description = "Speaker (Echo Cancelled)"
                media.class      = "Audio/Sink"
            }
            playback.props = {
                node.name = "echo-cancel-playback"
            }
        }
        flags = [ ifexists nofail ]
    }
]
