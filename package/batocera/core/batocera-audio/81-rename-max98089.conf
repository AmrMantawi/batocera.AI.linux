monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*max98089.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "MAX98089 Speaker"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*max98089.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "MAX98089 Microphone"
      }
    }
  }
]
